<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Sport Plánovač</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        overflow-x: clip;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f1f5f9;
        min-height: 100vh;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
      }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      @media screen and (max-width: 768px) {
        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        input[type="email"],
        input[type="password"],
        select,
        textarea {
          font-size: 16px !important;
        }
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      button, a, input, select {
        touch-action: manipulation;
      }
      @keyframes slideInRight {
        from { opacity: 0; transform: translateX(30px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-30px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes drawerSlideIn {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      @keyframes backdropFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes issueCardIn {
        from { opacity: 0; transform: translateY(12px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes tabSlideInRight {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes tabSlideInLeft {
        from { opacity: 0; transform: translateX(-20px); }
        to { opacity: 1; transform: none; }
      }
      .animate-slide-in-right { animation: slideInRight 0.25s ease-out both; }
      .animate-slide-in-left { animation: slideInLeft 0.25s ease-out both; }
      .animate-fade-in-up { animation: fadeInUp 0.2s ease-out both; }
      .animate-drawer-in { animation: drawerSlideIn 0.3s cubic-bezier(0.32, 0.72, 0, 1) both; }
      .animate-backdrop-in { animation: backdropFadeIn 0.25s ease-out both; }
      .animate-issue-card { animation: issueCardIn 0.3s ease-out both; }
      .animate-tab-slide-in-right { animation: tabSlideInRight 0.22s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .animate-tab-slide-in-left { animation: tabSlideInLeft 0.22s cubic-bezier(0.16, 1, 0.3, 1) both; }
      @media (prefers-reduced-motion: reduce) {
        .animate-tab-slide-in-right,
        .animate-tab-slide-in-left {
          animation: none !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-qr-code": "https://aistudiocdn.com/react-qr-code@^2.0.18",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "date-fns/": "https://aistudiocdn.com/date-fns@^4.1.0/",
    "date-fns": "https://aistudiocdn.com/date-fns@^4.1.0",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@testing-library/react": "https://aistudiocdn.com/@testing-library/react@^16.3.0",
    "@testing-library/jest-dom": "https://aistudiocdn.com/@testing-library/jest-dom@^6.9.1",
    "vitest": "https://aistudiocdn.com/vitest@^4.0.14",
    "@testing-library/user-event": "https://aistudiocdn.com/@testing-library/user-event@^14.6.1",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
